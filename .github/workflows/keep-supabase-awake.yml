# Keeps the free Supabase project from pausing (it pauses after 1 week
# with no activity). Reads one row twice a week; can also be run by hand
# from the Actions tab. The key below is the public "publishable" key that
# the fan page and app already use; it only allows what the database's
# row-level security permits.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4' # Monday and Thursday, 06:17 UTC (09:17 Jeddah)
    - cron: '41 6 1 * *' # 1st of every month: keep the repo itself active
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        env:
          KEY: sb_publishable_3I-qLBlxxieSUjIKA4UtvQ_vSbct9b-
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ucelceflwdngfbzibnok.supabase.co/rest/v1/tournaments?select=id&limit=1" \
            -H "apikey: $KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"

  # GitHub pauses scheduled jobs in a repo with no commits for 60 days.
  # A small monthly commit keeps this workflow running for good.
  stay-active:
    if: github.event.schedule == '41 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Note the date of this check
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .github/last-check.txt
          git config user.name "nowsix-keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .github/last-check.txt
          git commit -m "Monthly keep-alive check" || exit 0
          git push
