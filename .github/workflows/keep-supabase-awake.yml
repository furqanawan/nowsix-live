# Keeps the free Supabase project from pausing (it pauses after 1 week
# with no activity). Reads one row twice a week; can also be run by hand
# from the Actions tab. The key below is the public "publishable" key that
# the fan page and app already use; it only allows what the database's
# row-level security permits.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4' # Monday and Thursday, 06:17 UTC (09:17 Jeddah)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        env:
          KEY: sb_publishable_3I-qLBlxxieSUjIKA4UtvQ_vSbct9b-
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ucelceflwdngfbzibnok.supabase.co/rest/v1/tournaments?select=id&limit=1" \
            -H "apikey: $KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
